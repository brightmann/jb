# Deploy the static-exported jb blog to GitHub Pages
# at https://brightmann.github.io/jb
# Builds with NEXT_BASE_PATH=/jb so all links and assets live under /jb.
# The Workers sites (jb.luckypoem.workers.dev, jb.brightmann.workers.dev)
# are unaffected — they build without NEXT_BASE_PATH.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        # yarn, not pnpm: the repo pins yarn@1.22.22 (packageManager) and
        # only ships yarn.lock — pnpm install --frozen-lockfile would fail
        # with no pnpm-lock.yaml present.
        run: yarn install --frozen-lockfile

      - name: Build (fetch Notion, basePath /jb)
        env:
          NEXT_BASE_PATH: /jb
        run: ./node_modules/.bin/next build

      - name: Export static site
        env:
          NEXT_BASE_PATH: /jb
        run: ./node_modules/.bin/next export

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
